name: Build & Release Android APK

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.1-rc.1)'
        required: true
        type: string

# Separate concurrency per ref — tag builds don't cancel master builds.
concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android APK (EAS preview)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # expo/expo-github-action installs EAS CLI and authenticates via EXPO_TOKEN.
      # Add EXPO_TOKEN as a repository secret in GitHub → Settings → Secrets.
      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Build the APK in EAS cloud. --json emits the build metadata to stdout
      # once the build completes. stderr is redirected so jq only sees JSON.
      - name: Build APK via EAS
        id: build
        run: |
          BUILD_JSON=$(eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --json \
            2>/dev/null)
          ARTIFACT_URL=$(echo "$BUILD_JSON" | jq -r '.[0].artifacts.buildUrl')
          echo "artifact_url=$ARTIFACT_URL" >> $GITHUB_OUTPUT

      - name: Download APK
        run: curl -fL "${{ steps.build.outputs.artifact_url }}" -o sous-chef.apk

      - name: Get short commit SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # workflow_dispatch and tag builds use the version input / tag name.
      # Master branch pushes fall back to the build-N naming.
      - name: Resolve release metadata
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG=""
          fi

          if [ -n "$TAG" ]; then
            if [[ "$TAG" == *-rc* ]] || [[ "$TAG" == *-alpha* ]] || [[ "$TAG" == *-beta* ]]; then
              echo "prerelease=true" >> $GITHUB_OUTPUT
            else
              echo "prerelease=false" >> $GITHUB_OUTPUT
            fi
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "name=$TAG — ${{ steps.sha.outputs.short }}" >> $GITHUB_OUTPUT
          else
            echo "tag=build-${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "name=Build #${{ github.run_number }} — ${{ steps.sha.outputs.short }}" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          body: |
            Android build from [`${{ steps.sha.outputs.short }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).

            **Install:** download `sous-chef.apk` and open it on your Android device.
            You may need to allow installation from unknown sources in your device settings.
          files: sous-chef.apk
          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
