<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">Exhausted robot sous chef head with chef hat</title>
  <desc id="desc">A friendly cream-colored robot head with a black display face, soft chef hat, and a mildly exhausted expression with an exhale puff, isolated on a transparent background.</desc>
  <defs>
    <radialGradient id="shellWarm" cx="42%" cy="28%" r="76%">
      <stop offset="0" stop-color="#fff0d6"/>
      <stop offset="0.34" stop-color="#f6dbad"/>
      <stop offset="0.62" stop-color="#dfbd86"/>
      <stop offset="0.84" stop-color="#c89d67"/>
      <stop offset="1" stop-color="#a97b49"/>
    </radialGradient>
    <radialGradient id="shellHighlight" cx="28%" cy="15%" r="62%">
      <stop offset="0" stop-color="#fff8eb" stop-opacity="0.92"/>
      <stop offset="0.45" stop-color="#fff1d8" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#fff1d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="faceGlass" cx="36%" cy="28%" r="86%">
      <stop offset="0" stop-color="#2a2f2b"/>
      <stop offset="0.52" stop-color="#111411"/>
      <stop offset="1" stop-color="#050706"/>
    </radialGradient>
    <linearGradient id="faceEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9ddb1"/>
      <stop offset="0.45" stop-color="#d5a872"/>
      <stop offset="1" stop-color="#80572f"/>
    </linearGradient>
    <radialGradient id="screenSheen" cx="25%" cy="11%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.38" stop-color="#cfead9" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hatCream" x1="0" y1="0" x2="0.86" y2="1">
      <stop offset="0" stop-color="#fff4dd"/>
      <stop offset="0.28" stop-color="#efd2a3"/>
      <stop offset="0.66" stop-color="#cda06d"/>
      <stop offset="1" stop-color="#9d7145"/>
    </linearGradient>
    <radialGradient id="hatPuffLight" cx="32%" cy="20%" r="74%">
      <stop offset="0" stop-color="#fff6e6"/>
      <stop offset="0.38" stop-color="#efd4a8"/>
      <stop offset="1" stop-color="#b17f4f"/>
    </radialGradient>
    <linearGradient id="hatBand" x1="0.1" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#fff2d7"/>
      <stop offset="0.55" stop-color="#dfb77f"/>
      <stop offset="1" stop-color="#956437"/>
    </linearGradient>
    <radialGradient id="glowMint" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e5ffd9" stop-opacity="1"/>
      <stop offset="0.42" stop-color="#b8ffd0" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#80f9a9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sideDisc" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#f5d8aa"/>
      <stop offset="0.58" stop-color="#bc8c5b"/>
      <stop offset="1" stop-color="#6f4528"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff1a7"/>
      <stop offset="0.38" stop-color="#ff9e2f"/>
      <stop offset="1" stop-color="#ff8a00" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#5b3e24" flood-opacity="0.35"/>
    </filter>
    <filter id="innerSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
      <feOffset dy="3" result="offset"/>
      <feComposite in="offset" in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="inner"/>
      <feColorMatrix in="inner" type="matrix" values="0 0 0 0 0.18 0 0 0 0 0.11 0 0 0 0 0.06 0 0 0 0.45 0"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
    <filter id="clothTexture" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="4" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="subtleGrain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.05"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <filter id="mintGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="faceClip">
      <rect x="265" y="522" width="724" height="472" rx="159" ry="159"/>
    </clipPath>
  </defs>

  <g filter="url(#softShadow)">
    <!-- chef hat puffs behind the head -->
    <g filter="url(#clothTexture)">
      <path d="M255 370C252 252 351 160 485 168c43-92 199-124 306-51 85-31 200 4 246 91 87 14 151 78 151 165 0 124-103 218-250 211H363C300 567 263 478 255 370Z" fill="url(#hatPuffLight)"/>
      <path d="M310 365c11-93 85-159 177-171-18 94-9 207 29 342H363c-43-17-58-93-53-171Z" fill="#f5d9ae" opacity="0.72"/>
      <path d="M496 183c51-91 208-104 299-48-66 81-85 238-44 398H512c-43-139-49-258-16-350Z" fill="#f7ddaf" opacity="0.78"/>
      <path d="M805 128c74-38 190-3 231 81-93 75-131 183-110 328H754c-36-165-17-312 51-409Z" fill="#e8c593" opacity="0.82"/>
      <path d="M1037 212c91 12 151 78 151 166 0 121-105 208-252 206-18-128 20-262 101-372Z" fill="#cea06d" opacity="0.63"/>
      <path d="M354 323c26-53 73-91 133-105" fill="none" stroke="#fff3db" stroke-width="17" stroke-linecap="round" opacity="0.42"/>
      <path d="M570 162c55-42 139-44 207-17" fill="none" stroke="#fff7e8" stroke-width="20" stroke-linecap="round" opacity="0.35"/>
      <path d="M842 153c66-15 139 13 177 67" fill="none" stroke="#fff0d3" stroke-width="16" stroke-linecap="round" opacity="0.28"/>
      <path d="M318 438c51-22 115-33 193-26" fill="none" stroke="#b88755" stroke-width="12" stroke-linecap="round" opacity="0.25"/>
      <path d="M536 412c109-27 241-27 384 0" fill="none" stroke="#a06f43" stroke-width="13" stroke-linecap="round" opacity="0.22"/>
      <path d="M926 428c95-19 174-7 225 32" fill="none" stroke="#895b36" stroke-width="12" stroke-linecap="round" opacity="0.22"/>
    </g>

    <!-- hat band -->
    <path d="M348 436C397 355 498 327 635 338h113c145-5 254 33 309 117 21 33 27 76 16 117-99-42-218-62-358-63H504c-85 1-151 17-205 49-8-44 5-87 49-122Z" fill="url(#hatBand)" filter="url(#innerSoft)"/>
    <path d="M365 444c52-55 144-77 271-69h117c129 0 229 27 292 88" fill="none" stroke="#fff3dc" stroke-width="30" stroke-linecap="round" opacity="0.38"/>
    <path d="M309 562c92-47 215-70 366-70 167 0 299 25 399 75" fill="none" stroke="#7b4d2b" stroke-width="12" opacity="0.22"/>

    <!-- outer head shell -->
    <path d="M162 727c0-211 84-314 255-336 118-15 292-14 420 0 174 20 256 127 256 336 0 225-101 347-305 363-95 8-230 8-324 0-202-17-302-138-302-363Z" fill="url(#shellWarm)"/>
    <path d="M162 727c0-211 84-314 255-336 118-15 292-14 420 0 174 20 256 127 256 336 0 225-101 347-305 363-95 8-230 8-324 0-202-17-302-138-302-363Z" fill="url(#shellHighlight)"/>
    <path d="M217 650c26-120 99-181 225-196 105-13 266-12 381 1 113 13 187 69 219 170" fill="none" stroke="#fff0d8" stroke-width="20" stroke-linecap="round" opacity="0.46"/>
    <path d="M216 895c54 123 151 177 306 185 82 4 196 4 280-3 129-11 213-65 258-174" fill="none" stroke="#815630" stroke-width="18" stroke-linecap="round" opacity="0.14"/>
    <path d="M164 729c0-211 82-314 254-336 118-15 291-14 420 0 173 20 254 127 254 334" fill="none" stroke="#ffefd5" stroke-width="8" opacity="0.55"/>

    <!-- side caps -->
    <g>
      <ellipse cx="1069" cy="771" rx="71" ry="147" fill="url(#sideDisc)"/>
      <ellipse cx="1062" cy="770" rx="43" ry="103" fill="none" stroke="#765033" stroke-width="9" opacity="0.4"/>
      <ellipse cx="1070" cy="768" rx="23" ry="63" fill="#e0b37a" opacity="0.35"/>
      <ellipse cx="1073" cy="770" rx="12" ry="32" fill="#ff9b19" filter="url(#mintGlow)"/>
      <ellipse cx="1074" cy="770" rx="5" ry="21" fill="#fff0a4"/>
    </g>
    <g opacity="0.42">
      <ellipse cx="178" cy="771" rx="34" ry="122" fill="#bd8c5a"/>
      <ellipse cx="184" cy="771" rx="17" ry="87" fill="#f2cf9d" opacity="0.4"/>
    </g>

    <!-- face screen bezel and glass -->
    <rect x="238" y="489" width="778" height="545" rx="187" ry="187" fill="url(#faceEdge)"/>
    <rect x="253" y="505" width="748" height="513" rx="174" ry="174" fill="#f2d2a3" opacity="0.92"/>
    <rect x="265" y="522" width="724" height="472" rx="159" ry="159" fill="url(#faceGlass)"/>
    <g clip-path="url(#faceClip)">
      <rect x="265" y="522" width="724" height="472" fill="url(#screenSheen)"/>
      <ellipse cx="434" cy="620" rx="207" ry="104" fill="#ffffff" opacity="0.045" transform="rotate(-14 434 620)"/>
      <path d="M302 922c184 49 427 61 641 13" stroke="#000" stroke-opacity="0.32" stroke-width="45" fill="none"/>
      <rect x="265" y="522" width="724" height="472" fill="#18201b" opacity="0.08" filter="url(#subtleGrain)"/>
    </g>

    <!-- glowing exhausted face: same friendly eyes, exhale mouth -->
    <g filter="url(#mintGlow)" stroke="#caffd9" stroke-linecap="round" stroke-linejoin="round">
      <!-- keep the original friendly eyes -->
      <path d="M372 750c20-44 82-45 104-2" fill="none" stroke-width="17"/>
      <path d="M779 750c20-44 82-45 104-2" fill="none" stroke-width="17"/>

      <!-- a small neutral mouth, like taking a breather -->
      <rect x="529" y="825" width="96" height="30" rx="15" ry="15" fill="#caffd9" stroke="none"/>

      <!-- exhale puff on the face screen -->
      <path d="M0 0c-14 0-24 9-24 22c0 11 9 20 20 20c5 0 10-2 14-5c2 12 14 21 27 21c16 0 28-12 28-28c0-2 0-4-1-6c12-2 21-12 21-25c0-14-11-25-25-25c-5 0-10 1-14 4c-4-14-17-23-32-23c-16 0-29 11-30 27c-3-1-5-1-8-1c-14 0-25 10-25 24c0 12 8 21 20 24c7 1 13-1 18-7c2 1 5 2 9 2" fill="#caffd9" opacity="0.92" transform="translate(430 875) scale(0.36)"/>
      <path d="M497 851c-10 8-20 13-30 16" fill="none" stroke-width="8" opacity="0.95"/>
    </g>
    <g opacity="0.96" stroke="#c7ffd8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M372 750c20-44 82-45 104-2" fill="none" stroke-width="12"/>
      <path d="M779 750c20-44 82-45 104-2" fill="none" stroke-width="12"/>
      <rect x="537" y="832" width="80" height="16" rx="8" ry="8" fill="#dcffe5" stroke="none" opacity="0.28"/>
      <path d="M497 851c-6 5-12 8-18 10" fill="none" stroke-width="4" opacity="0.65"/>
    </g>

    <!-- fine shell details -->
    <path d="M303 508c50-50 112-73 201-81" fill="none" stroke="#fff6e6" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
    <path d="M878 431c74 18 124 58 151 120" fill="none" stroke="#86603d" stroke-width="7" stroke-linecap="round" opacity="0.18"/>
    <path d="M316 1002c64 55 147 75 262 77" fill="none" stroke="#fff1da" stroke-width="8" stroke-linecap="round" opacity="0.25"/>
    <path d="M736 1078c114-4 198-34 247-98" fill="none" stroke="#6c4428" stroke-width="7" stroke-linecap="round" opacity="0.2"/>
  </g>
</svg>
